name: Synapse13 full gate validation

on:
  push:
    branches: [diagnostic/synapse13-node22-20261029]

permissions:
  contents: read

jobs:
  node22-full-boundary-and-focused-tests:
    runs-on: ubuntu-latest
    env:
      ALLOW_MISSING_FS_HELPER: "1"
      # The contributor explicitly authorized all languages for upstream work.
      VERIFY_SKIP_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2a1dcae7c8124833c19c4d5ec3329835f1137c8
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Record exact source and runtime
        run: |
          git rev-parse HEAD
          node --version
          npm --version
          go version
          cargo --version
          rustc --version
      - name: Install dependencies
        run: npm ci
      - name: Install mobile-app dependencies
        run: npm --prefix packages/mobile-app ci
      - name: Complete unchanged boundary gate including Go and Rust tests
        run: npm run verify:boundary
      - name: Focused plugin tests including real PostgreSQL
        run: >-
          node --import tsx --test --experimental-test-module-mocks
          packages/api/src/modules/mcp-plugins/tool-resolver.test.ts
          packages/api/src/modules/mcp-plugins/repo-visibility.test.ts
          packages/api/src/modules/mcp-plugins/repo-visibility-db.test.ts

  secret-scan-exact-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2a1dcae7c8124833c19c4d5ec3329835f1137c8
          fetch-depth: 0
      - name: Run repository-pinned scanner with redaction
        run: |
          bin="$(bash scripts/ensure-gitleaks.sh)"
          "$bin" git --redact --no-banner \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --baseline-path "$GITHUB_WORKSPACE/.gitleaks-baseline.json" \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-redacted.json"
      - name: Retain finding locations only
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          const root = process.env.RUNNER_TEMP;
          const input = root + '/gitleaks-redacted.json';
          if (existsSync(input)) {
            const fields = ['RuleID', 'File', 'StartLine', 'EndLine', 'Commit', 'Fingerprint', 'Description'];
            const rows = JSON.parse(readFileSync(input, 'utf8')).map(row =>
              Object.fromEntries(fields.map(key => [key, row[key]])));
            writeFileSync(root + '/gitleaks-metadata.json', JSON.stringify(rows, null, 2));
            console.log('Finding locations retained: ' + rows.length);
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-finding-locations
          path: ${{ runner.temp }}/gitleaks-metadata.json
          if-no-files-found: ignore
