name: Synapse13 exact-source Cargo tail diagnostic

on:
  push:
    branches: [diagnostic/synapse13-go-tail-20261029]

permissions:
  contents: read

jobs:
  original-cargo-tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 11952cb4dbbf45e574b71b146c606426e068fc33
      - name: Record exact source and runtime
        run: |
          git rev-parse HEAD
          cargo --version
          rustc --version
      - name: Run original Cargo tail
        run: (cd sidecars/fs-helper && cargo test)
