name: Synapse13 exact-source Go tail diagnostic

on:
  push:
    branches: [diagnostic/synapse13-go-tail-20261029]

permissions:
  contents: read

jobs:
  original-go-tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cc771093df02bc769a551cd862944761698ea0ff
      - name: Record exact source and runtime
        run: |
          git rev-parse HEAD
          go version
      - name: Install declared DeskAct X11 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libx11-dev libxtst-dev libxinerama-dev libxrandr-dev libxcomposite-dev libxrender-dev libxfixes-dev
      - name: Run original Go tail
        run: (cd sidecars/cua && go test ./...)
